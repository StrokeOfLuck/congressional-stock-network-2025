<style id="mobile-network-control-overrides">
/* Mobile-only cleanup for the graph controls. Desktop layout is unchanged. */
.mobile-network-controls {
  display: none;
}

@media (max-width: 760px) {
  /* Keep the Explore / About / Methodology pills accessible at the bottom-left
     on phones, opposite the graph tools. */
  .topbar .nav-actions,
  body.explore-page-active .topbar .nav-actions,
  body.embed-mode.explore-page-active .topbar .nav-actions,
  body:not(.explore-page-active) .topbar .nav-actions {
    position: fixed !important;
    top: auto !important;
    right: auto !important;
    bottom: 8px !important;
    left: 8px !important;
    z-index: 4460 !important;
    width: auto !important;
    max-width: calc(100vw - 170px) !important;
    margin: 0 !important;
    pointer-events: auto !important;
  }

  /* The compact project card stays one line by default. Tapping it expands the
     subtitle, and the graph controls are repositioned from its actual height. */
  body.explore-page-active .topbar .brand-block {
    pointer-events: auto !important;
    cursor: pointer;
    touch-action: manipulation;
  }

  body.explore-page-active .topbar .brand-subtitle {
    max-width: 100% !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }

  body.explore-page-active.mobile-brand-expanded .topbar .brand-subtitle {
    overflow: visible !important;
    text-overflow: clip !important;
    white-space: normal !important;
  }

  /* Remove the old space reserved for the top navigation row. JavaScript sets
     these variables from the live title/search heights so the layout remains
     tight when the project description is expanded. */
  body.explore-page-active .network-toolbar.graph-search-panel,
  body.embed-mode.explore-page-active .network-toolbar.graph-search-panel {
    top: var(--mobile-search-top, 76px) !important;
  }

  /* Keep the existing desktop controls in the DOM for graph logic, but use a
     compact mobile picker instead of squeezing three long buttons together. */
  body.explore-page-active .graph-layer-panel,
  body.embed-mode.explore-page-active .graph-layer-panel {
    display: none !important;
  }

  /* The legend is available on demand so it does not cover the network. */
  body.explore-page-active .graph-legend,
  body.embed-mode.explore-page-active .graph-legend {
    display: none !important;
  }

  body.explore-page-active.mobile-legend-open .graph-legend,
  body.embed-mode.explore-page-active.mobile-legend-open .graph-legend {
    display: flex !important;
    top: var(--mobile-legend-top, 188px) !important;
    left: 8px !important;
    bottom: auto !important;
    width: auto !important;
    max-width: min(220px, calc(100vw - 16px)) !important;
    max-height: calc(100dvh - var(--mobile-legend-top, 188px) - 70px);
    overflow-y: auto;
    padding: 9px 10px;
    font-size: 9.5px;
    z-index: 4380;
  }

  body.explore-page-active .mobile-network-controls,
  body.embed-mode.explore-page-active .mobile-network-controls {
    position: absolute;
    top: var(--mobile-controls-top, 138px) !important;
    left: 8px;
    right: 8px;
    z-index: 4400;
    display: flex;
    align-items: center;
    gap: 6px;
    width: auto;
    pointer-events: auto;
  }

  .mobile-view-picker {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
  }

  .mobile-view-trigger,
  .mobile-legend-toggle {
    height: 36px;
    box-sizing: border-box;
    border: 1px solid rgba(205,210,216,.9);
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #343a40;
    box-shadow: 0 6px 18px rgba(24,31,39,.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
  }

  .mobile-view-trigger {
    display: flex;
    width: 100%;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 13px;
    text-align: left;
  }

  .mobile-view-trigger-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mobile-view-trigger-caret {
    flex: 0 0 auto;
    font-size: 10px;
    transition: transform .16s ease;
  }

  .mobile-view-trigger[aria-expanded="true"] .mobile-view-trigger-caret {
    transform: rotate(180deg);
  }

  .mobile-legend-toggle {
    flex: 0 0 auto;
    padding: 0 13px;
  }

  .mobile-legend-toggle[aria-expanded="true"] {
    background: rgba(23,25,28,.94);
    color: #fff;
    border-color: rgba(23,25,28,.94);
  }

  .mobile-view-menu {
    position: absolute;
    top: 42px;
    left: 0;
    z-index: 4500;
    display: grid;
    width: min(280px, calc(100vw - 90px));
    padding: 6px;
    gap: 3px;
    border: 1px solid rgba(205,210,216,.92);
    border-radius: 14px;
    background: rgba(255,255,255,.97);
    box-shadow: 0 10px 28px rgba(24,31,39,.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .mobile-view-menu[hidden] {
    display: none !important;
  }

  .mobile-view-option {
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #343a40;
    font: inherit;
    font-size: 11px;
    font-weight: 650;
    line-height: 1.25;
    text-align: left;
  }

  .mobile-view-option:hover,
  .mobile-view-option:focus-visible {
    background: #f1f3f5;
    outline: none;
  }

  .mobile-view-option.active {
    background: rgba(23,25,28,.94);
    color: #fff;
  }

  .mobile-view-option:disabled {
    opacity: .42;
  }

  /* Keep graph tools compact and safely inside the phone width. */
  body.explore-page-active .network-tool-actions.graph-tool-panel,
  body.embed-mode.explore-page-active .network-tool-actions.graph-tool-panel {
    left: auto;
    right: 8px;
    bottom: 8px;
    max-width: calc(100vw - 16px);
    padding: 3px;
  }

  body.explore-page-active .graph-tool-panel .network-tool-button {
    padding: 6px 8px;
    font-size: 10px;
  }

  body.explore-page-active .graph-tool-panel .graph-zoom-button {
    width: 29px;
    height: 28px;
    padding: 0;
    font-size: 18px;
  }
}
</style>

<script id="mobile-network-controls-script">
(function () {
  function initMobileNetworkControls() {
    if (document.querySelector('.mobile-network-controls')) return;

    const networkCard = document.querySelector('.network-card');
    const layerPanel = document.querySelector('.graph-layer-panel');
    const legend = document.querySelector('.graph-legend');
    const searchPanel = document.querySelector('.network-toolbar.graph-search-panel');
    const brandBlock = document.querySelector('.topbar .brand-block');
    const stockButton = document.getElementById('stockOnlyBtn');
    const committeeButton = document.getElementById('committeeBtn');
    const fullButton = document.getElementById('subcommitteeBtn');

    if (!networkCard || !layerPanel || !legend || !stockButton || !committeeButton || !fullButton) {
      return;
    }

    const controls = document.createElement('div');
    controls.className = 'mobile-network-controls';
    controls.setAttribute('aria-label', 'Network display controls');

    const picker = document.createElement('div');
    picker.className = 'mobile-view-picker';

    const trigger = document.createElement('button');
    trigger.className = 'mobile-view-trigger';
    trigger.type = 'button';
    trigger.setAttribute('aria-haspopup', 'menu');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.innerHTML = '<span class="mobile-view-trigger-label">View: Full network</span><span class="mobile-view-trigger-caret" aria-hidden="true">▼</span>';

    const menu = document.createElement('div');
    menu.className = 'mobile-view-menu';
    menu.setAttribute('role', 'menu');
    menu.hidden = true;

    const views = [
      { source: fullButton, label: 'Full network', menuLabel: 'Stocks + committees + subcommittees' },
      { source: committeeButton, label: 'Committees only', menuLabel: 'Stocks + committees only' },
      { source: stockButton, label: 'Stocks only', menuLabel: 'Stocks only' }
    ];

    const options = views.map(function (view) {
      const option = document.createElement('button');
      option.className = 'mobile-view-option';
      option.type = 'button';
      option.setAttribute('role', 'menuitem');
      option.textContent = view.menuLabel;
      option.disabled = view.source.disabled;
      menu.appendChild(option);
      return { option: option, view: view };
    });

    const legendToggle = document.createElement('button');
    legendToggle.className = 'mobile-legend-toggle';
    legendToggle.type = 'button';
    legendToggle.textContent = 'Legend';
    legendToggle.setAttribute('aria-expanded', 'false');

    picker.appendChild(trigger);
    picker.appendChild(menu);
    controls.appendChild(picker);
    controls.appendChild(legendToggle);
    layerPanel.insertAdjacentElement('afterend', controls);

    function positionMobileChrome() {
      if (window.innerWidth > 760 || !document.body.classList.contains('explore-page-active')) {
        return;
      }

      if (!brandBlock || !searchPanel) return;

      const cardRect = networkCard.getBoundingClientRect();
      const brandRect = brandBlock.getBoundingClientRect();
      const searchTop = Math.max(8, Math.round(brandRect.bottom - cardRect.top + 6));

      document.body.style.setProperty('--mobile-search-top', searchTop + 'px');

      window.requestAnimationFrame(function () {
        const freshCardRect = networkCard.getBoundingClientRect();
        const searchRect = searchPanel.getBoundingClientRect();
        const controlsTop = Math.max(
          searchTop + 48,
          Math.round(searchRect.bottom - freshCardRect.top + 2)
        );
        const legendTop = controlsTop + controls.getBoundingClientRect().height + 8;

        document.body.style.setProperty('--mobile-controls-top', controlsTop + 'px');
        document.body.style.setProperty('--mobile-legend-top', Math.round(legendTop) + 'px');
      });
    }

    function scheduleMobileChromePosition() {
      window.requestAnimationFrame(function () {
        positionMobileChrome();
        window.setTimeout(positionMobileChrome, 80);
      });
    }

    if (brandBlock) {
      brandBlock.setAttribute('role', 'button');
      brandBlock.setAttribute('tabindex', '0');
      brandBlock.setAttribute('aria-expanded', 'false');
      brandBlock.setAttribute('title', 'Tap to show the full project description');

      function toggleBrandDescription() {
        if (window.innerWidth > 760 || !document.body.classList.contains('explore-page-active')) return;
        const opening = !document.body.classList.contains('mobile-brand-expanded');
        document.body.classList.toggle('mobile-brand-expanded', opening);
        brandBlock.setAttribute('aria-expanded', opening ? 'true' : 'false');
        scheduleMobileChromePosition();
      }

      brandBlock.addEventListener('click', function (event) {
        event.stopPropagation();
        toggleBrandDescription();
      });

      brandBlock.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleBrandDescription();
        }
      });
    }

    function activeView() {
      return views.find(function (view) {
        return view.source.classList.contains('active');
      }) || views[0];
    }

    function syncViewUi() {
      const current = activeView();
      const label = trigger.querySelector('.mobile-view-trigger-label');
      if (label) label.textContent = 'View: ' + current.label;

      options.forEach(function (item) {
        item.option.classList.toggle('active', item.view === current);
        item.option.disabled = item.view.source.disabled;
      });
    }

    function closeMenu() {
      menu.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
    }

    function closeLegend() {
      document.body.classList.remove('mobile-legend-open');
      legendToggle.setAttribute('aria-expanded', 'false');
    }

    function closeBrandDescription() {
      document.body.classList.remove('mobile-brand-expanded');
      if (brandBlock) brandBlock.setAttribute('aria-expanded', 'false');
      scheduleMobileChromePosition();
    }

    trigger.addEventListener('click', function (event) {
      event.stopPropagation();
      const opening = menu.hidden;
      closeLegend();
      menu.hidden = !opening;
      trigger.setAttribute('aria-expanded', opening ? 'true' : 'false');
    });

    options.forEach(function (item) {
      item.option.addEventListener('click', function () {
        if (item.option.disabled) return;
        item.view.source.click();
        syncViewUi();
        closeMenu();
      });

      item.view.source.addEventListener('click', function () {
        window.setTimeout(syncViewUi, 0);
      });
    });

    legendToggle.addEventListener('click', function (event) {
      event.stopPropagation();
      const opening = !document.body.classList.contains('mobile-legend-open');
      closeMenu();
      document.body.classList.toggle('mobile-legend-open', opening);
      legendToggle.setAttribute('aria-expanded', opening ? 'true' : 'false');
    });

    document.addEventListener('click', function (event) {
      if (!picker.contains(event.target)) closeMenu();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeMenu();
        closeLegend();
        closeBrandDescription();
      }
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 760) {
        closeMenu();
        closeLegend();
        document.body.classList.remove('mobile-brand-expanded');
        if (brandBlock) brandBlock.setAttribute('aria-expanded', 'false');
      } else {
        scheduleMobileChromePosition();
      }
    });

    window.addEventListener('orientationchange', scheduleMobileChromePosition);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(scheduleMobileChromePosition);
    }

    syncViewUi();
    scheduleMobileChromePosition();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMobileNetworkControls);
  } else {
    initMobileNetworkControls();
  }
})();
</script>
