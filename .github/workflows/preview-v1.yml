name: Build isolated v1 preview
on:
  push:
    branches: [review/network-v1.0]
    paths-ignore: ['preview/**', 'validation/**']
permissions:
  contents: write
concurrency:
  group: preview-v1
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::dplyr
            any::readr
            any::stringr
            any::visNetwork
            any::htmltools
            any::jsonlite
            any::yaml
            any::tibble
      - name: Render from source
        run: Rscript render.R
      - name: Verify analysis independently
        run: python3 verify_v1.py
      - name: Save branch preview (no Pages deployment)
        run: |
          mkdir -p preview
          cp index.html preview/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/index.html validation
          git diff --cached --quiet || git commit -m 'Build verified v1 preview [skip ci]'
          git push origin HEAD:review/network-v1.0
